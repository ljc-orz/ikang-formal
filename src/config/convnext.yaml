seed: 2026

data:
  backend: torchvision
  train_sampling: balanced
  train_split: train
  validation_split: internal_validation
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  shuffle_buffer: 1000
  num_workers: 8
  dali_num_threads: 4
  dali_prefetch_queue_depth: 2
  dali_dont_use_mmap: false

model:
  backbone: convnext
  name: convnext_tiny.fb_in22k_ft_in1k
  pretrained: true
  pretrained_weights: pretrained-weights/convnext_tiny.fb_in22k_ft_in1k/pytorch_model.bin
  retfound_pretrained_weights: pretrained-weights/RETFound_dinov2_shanghai/RETFound_dinov2_shanghai_backbone.pth
  drop_path_rate: 0.1
  metadata_hidden_dim: 16
  classifier_dropout: 0.2
  lora_last_n_blocks: 2
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.0

training:
  max_epochs: 30
  batch_size: 256
  gradient_accumulation_steps: 1
  backbone_lr: 1.0e-4
  head_lr: 3.0e-4
  weight_decay: 0.05
  gradient_clip_norm: 1.0
  amp: fp16
  early_stopping_patience: 6
  early_stopping_min_delta: 0.0001

loss:
  pos_weight: auto
  max_pos_weight: 10.0

scheduler:
  warmup_epochs: 1
  min_lr: 1.0e-6

checkpoint:
  primary_metric: val_auprc
  secondary_metric: val_auroc
  mode: max
